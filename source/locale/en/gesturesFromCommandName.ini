[humanwareCommands.HumanwareCommands]
	# Translators: Corresponding keyboard shortcuts to select all content
	selectAll = "control+a"
	# Translators: Corresponding keyboard shortcuts to undo an action
	undo = "control+z"
	# Translators: Corresponding keyboard shortcuts to redo an action
	redo = "control+y"
	# Translators: Corresponding keyboard shortcuts to save a file
	save = "control+s"
	# Translators: Corresponding keyboard shortcuts to save a file with a new name
	saveAs = "f12"
	# Translators: Corresponding keyboard shortcuts to print a file
	print = "control+p"
	# Translators: Corresponding keyboard shortcuts to copy selected content
	copy = "control+c"
	# Translators: Corresponding keyboard shortcuts to cut selected content
	cut = "control+x"
	# Translators: Corresponding keyboard shortcuts to paste content from clipboard
	paste = "control+v"
	driveSelection = "control+d"
	
# For Word and Outlook
[appModules.winword]
	# Translators: Corresponding keyboard shortcuts to open a file in word
	open = "control+o"
	# Translators: Corresponding keyboard shortcuts to create a new file in word
	new = "control+n"
	# Translators: Corresponding keyboard shortcuts to exit word
	exit = "alt+f4"
	# Translators: Corresponding keyboard shortcuts to show the word count dialog in word
	wordCount = "control+shift+g"
	# Translators: Corresponding keyboard shortcuts to toggle between read mode and edit mode in word
	readMode = "nvda+space"
	# Translators: Corresponding keyboard shortcuts to find the current location in word
	whereAmI = "nvda+end"
	# Translators: Corresponding keyboard shortcuts to find in word
	find = "control+f"
	# Translators: Corresponding keyboard shortcuts to find the previous instance of the search term in word
	findPrevious = "control+pageup"
	# Translators: Corresponding keyboard shortcuts to find the next instance of the search term in word
	findNext = "control+pagedown"
	# Translators: Corresponding keyboard shortcuts to replace in word
	replace = "control+h"
	# Translators: Corresponding keyboard shortcuts to insert an equation in word
	insertOrEditEquation = "alt+="
	# Translators: Corresponding keyboard shortcuts to open an expression in the keymath application from word
	keyMath = "control+m"
	# Translators: Corresponding keyboard shortcuts to apply center alignment in word
	centerAlignment = "control+e"
	# Translators: Corresponding keyboard shortcuts to apply left alignment in word
	leftAlignment = "control+l"
	# Translators: Corresponding keyboard shortcuts to apply right alignment in word
	rightAlignment = "control+r"
	# Translators: Corresponding keyboard shortcuts to apply justify alignment in word
	justifyAlignment = "control+j"
	# Translators: Corresponding keyboard shortcuts to apply bold formatting in word
	bold = "control+b"
	# Translators: Corresponding keyboard shortcuts to apply italics formatting in word
	italics = "control+i"
	# Translators: Corresponding keyboard shortcuts to apply underline formatting in word
	underline = "control+u"
	# Translators: Corresponding keyboard shortcuts to open the font dialog in word
	openFontDialog = "control+shift+f"
	# Translators: Corresponding keyboard shortcuts to increase font size in word
	increaseFontSize = "control+shift+."
	# Translators: Corresponding keyboard shortcuts to decrease font size in word
	decreaseFontSize = "control+shift+,"
	# Translators: Corresponding keyboard shortcuts to insert a hyperlink in word
	insertHyperlink = "control+k"
	# Translators: Corresponding keyboard shortcuts to insert a table in word
	insertTable = "control+shift+f2"
	# Translators: Corresponding keyboard shortcuts to insert a braille symbol in word
	# Note: Available in the expression editor in keyMath
	insertBrailleSymbol = "control+i"
	# Translators: Corresponding keyboard shortcuts to insert a template in word
	# Note: Available in the expression editor in keyMath
	insertTemplate = "control+k" 
	# Translators: Corresponding keyboard shortcuts to announce the current mathML expression in word
	# Note: Available in the expression editor in keyMath
	announceExpression = "control+h"
	# Translators: Corresponding keyboard shortcuts to copy mathML to clipboard in word
	# Note: Available in the expression editor in keyMath
	copyMathMLToClipboard = "control+alt+shift+c"
	# Translators: Corresponding keyboard shortcuts to complete a mathML entry in word
	# Note: Available in the expression editor in keyMath
	completeMathMLEntry = "tab+enter"
	styles = "control+alt+shift+s"

