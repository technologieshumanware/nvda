[globalCommands.GlobalCommands]
	leftMouseClick = kb(laptop):NVDA+ج
	toggleLeftMouseButton = kb(laptop):NVDA+control+ج
	rightMouseClick = kb(laptop):NVDA+د
	toggleRightMouseButton = kb(laptop):NVDA+control+د
	review_currentLine = kb(laptop):shift+NVDA+ز
	review_currentWord = kb(laptop):control+NVDA+ز
	review_currentCharacter = kb(laptop):NVDA+ز
	reportFocusObjectAccelerator =kb(laptop):control+shift+NVDA+ز
	navigatorObject_previousInFlow =kb(laptop):NVDA++shift+ج
	navigatorObject_nextInFlow =kb(laptop):NVDA+shift+د

[virtualBuffers.VirtualBuffer]
	moveToStartOfContainer = kb(laptop):shift+و
	movePastEndOfContainer = kb(laptop):و
[NVDAObjects.window.winword.WordDocument]
	increaseDecreaseFontSize = kb:control+ج, kb:control+د

[appModules.powerpnt.AppModule]
	alignLeft = kb:control+l
	alignCenter = kb:control+e
	alignRight = kb:control+r
	toggleBold = kb:control+b
	toggleItalic = kb:control+i
	toggleUnderline = kb:control+u
	increaseFontSize = kb:control+alt+]
	decreaseFontSize = kb:control+shift+<
